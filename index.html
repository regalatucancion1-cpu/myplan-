<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Mi Plan de Déficit</title>
<meta name="description" content="Plan de déficit: peso, menú del día, recetas, compra y guía para comer fuera.">
<meta name="theme-color" content="#EDF1EC" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0E1815" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Mi Plan">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Figtree:wght@400;500;600;700&display=swap">
<style>:root{color-scheme:light;padding:env(safe-area-inset-top,0px) 0 0}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>
<style>
/* Layout: una columna de app, pensada para el móvil; cifras grandes tipo báscula, barra de pestañas abajo. */
:root {
  --bg: #EDF1EC;
  --surface: #FFFFFF;
  --sunk: #E1E8E2;
  --ink: #142B25;
  --muted: #586C65;
  --line: #D2DBD5;
  --pine: #1C5848;
  --on-pine: #FFFFFF;
  --pine-soft: #DCEBE5;
  --tomato: #C5391F;
  --tomato-soft: #F8E2DC;
  --saffron: #D99A0B;
  --saffron-soft: #FBEFCF;
  --shade: rgba(8, 22, 18, .55);
  --display: 'Barlow Condensed', 'Arial Narrow', 'Helvetica Neue', sans-serif;
  --body: 'Figtree', system-ui, -apple-system, 'Segoe UI', sans-serif;
  --r: 14px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0E1815; --surface: #16231F; --sunk: #1E2E29; --ink: #E7F0EB; --muted: #96ABA3; --line: #2B3E38;
    --pine: #63C6A6; --on-pine: #0B1512; --pine-soft: #1D3A32; --tomato: #F17660; --tomato-soft: #3B211C;
    --saffron: #F1C04C; --saffron-soft: #3A3018; --shade: rgba(0, 0, 0, .65); color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0E1815; --surface: #16231F; --sunk: #1E2E29; --ink: #E7F0EB; --muted: #96ABA3; --line: #2B3E38;
  --pine: #63C6A6; --on-pine: #0B1512; --pine-soft: #1D3A32; --tomato: #F17660; --tomato-soft: #3B211C;
  --saffron: #F1C04C; --saffron-soft: #3A3018; --shade: rgba(0, 0, 0, .65); color-scheme: dark;
}
*, *::before, *::after { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font-family: var(--body); font-size: 16px; line-height: 1.45; -webkit-text-size-adjust: 100%; }
button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--pine); outline-offset: 2px; }
h1, h2, h3, p, ul, ol { margin: 0; }
ul, ol { padding: 0; list-style: none; }

.app { max-width: 760px; margin: 0 auto; padding-inline: 16px; padding-block: 12px 104px; display: flex; flex-direction: column; gap: 16px; }
.top { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.brand { font-family: var(--display); font-weight: 700; font-size: 28px; letter-spacing: .02em; text-transform: uppercase; line-height: 1; }
.brand small { display: block; font-family: var(--body); font-weight: 500; font-size: 13px; letter-spacing: 0; text-transform: none; color: var(--muted); margin-top: 4px; font-variant-numeric: tabular-nums; }
.sync { font-size: 12px; color: var(--muted); display: flex; align-items: center; gap: 6px; }
.sync::before { content: ''; width: 7px; height: 7px; border-radius: 50%; background: var(--muted); }
.sync[data-s="ok"]::before { background: var(--pine); }
.sync[data-s="err"]::before { background: var(--tomato); }

.tabs { position: fixed; left: 0; right: 0; bottom: 0; z-index: 20; background: var(--surface); border-top: 1px solid var(--line); display: flex; justify-content: center; padding: 6px 8px calc(6px + env(safe-area-inset-bottom, 0px)); }
.tabs div { display: flex; width: 100%; max-width: 560px; }
.tab { flex: 1; min-width: 0; background: none; border: 0; padding: 6px 2px; display: flex; flex-direction: column; align-items: center; gap: 2px; font-size: 11.5px; font-weight: 600; color: var(--muted); border-radius: 10px; }
.tab svg { width: 24px; height: 24px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
.tab[aria-selected="true"] { color: var(--pine); background: var(--pine-soft); }

#view { display: flex; flex-direction: column; gap: 16px; min-width: 0; }
.h2 { font-family: var(--display); font-weight: 600; font-size: 22px; text-transform: uppercase; letter-spacing: .03em; line-height: 1.1; text-wrap: balance; }
.lbl { font-size: 12px; font-weight: 700; letter-spacing: .07em; text-transform: uppercase; color: var(--muted); }
.muted { color: var(--muted); }
.small { font-size: 13.5px; }
.card { background: var(--surface); border-radius: var(--r); padding: 16px; display: flex; flex-direction: column; gap: 12px; min-width: 0; }
.row { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.row > .grow { flex: 1; min-width: 0; }
.sec { display: flex; flex-direction: column; gap: 10px; min-width: 0; }

.btn { border: 1px solid var(--line); background: var(--surface); border-radius: 10px; padding: 9px 14px; font-weight: 600; font-size: 14.5px; line-height: 1.2; }
.btn.pri { background: var(--pine); border-color: var(--pine); color: var(--on-pine); }
.btn.sm { padding: 6px 10px; font-size: 13px; }
.btn.ghost { border-color: transparent; background: none; color: var(--pine); padding-inline: 6px; }
.btn:disabled { opacity: .5; cursor: default; }
.icon { width: 38px; height: 38px; padding: 0; display: inline-flex; align-items: center; justify-content: center; border-radius: 10px; border: 1px solid var(--line); background: var(--surface); flex: none; }
.icon svg { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.icon.on { background: var(--saffron-soft); border-color: var(--saffron); color: var(--ink); }
.icon.on svg { fill: var(--saffron); stroke: var(--saffron); }
.seg { display: inline-flex; background: var(--sunk); border-radius: 10px; padding: 3px; gap: 2px; }
.seg button { border: 0; background: none; padding: 6px 12px; border-radius: 8px; font-weight: 600; font-size: 13.5px; color: var(--muted); }
.seg button[aria-pressed="true"] { background: var(--surface); color: var(--ink); }
.chips { display: flex; gap: 6px; flex-wrap: wrap; }
.chip { border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 6px 12px; font-size: 13.5px; font-weight: 600; color: var(--muted); }
.chip[aria-pressed="true"] { background: var(--pine); border-color: var(--pine); color: var(--on-pine); }
.tag { display: inline-block; font-size: 11.5px; font-weight: 700; letter-spacing: .04em; text-transform: uppercase; padding: 2px 7px; border-radius: 6px; background: var(--sunk); color: var(--muted); white-space: nowrap; }
.tag.t { background: var(--tomato-soft); color: var(--tomato); }
.tag.p { background: var(--pine-soft); color: var(--pine); }
input[type="text"], input[type="date"], input[type="search"] { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 9px 12px; min-width: 0; width: 100%; }
.num { font-family: var(--display); font-weight: 600; font-variant-numeric: tabular-nums; line-height: 1; }

/* Hoy */
.daynav { display: flex; align-items: center; gap: 8px; }
.daynav .grow { text-align: center; }
.daynav .fecha { font-family: var(--display); font-weight: 600; font-size: 26px; text-transform: uppercase; letter-spacing: .02em; line-height: 1.05; }
.week { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; }
.wd { border: 1px solid transparent; background: var(--surface); border-radius: 10px; padding: 6px 0 5px; display: flex; flex-direction: column; align-items: center; gap: 1px; min-width: 0; }
.wd b { font-family: var(--display); font-size: 19px; font-weight: 600; font-variant-numeric: tabular-nums; line-height: 1.1; }
.wd span { font-size: 11px; color: var(--muted); text-transform: uppercase; font-weight: 700; letter-spacing: .04em; }
.wd i { font-style: normal; font-size: 10px; font-weight: 700; color: var(--tomato); height: 12px; line-height: 12px; letter-spacing: .03em; }
.wd.hoy { border-color: var(--line); }
.wd[aria-current="true"] { background: var(--pine); border-color: var(--pine); }
.wd[aria-current="true"] b, .wd[aria-current="true"] span, .wd[aria-current="true"] i { color: var(--on-pine); }
.meters { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
.meter { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.meter .num { font-size: 38px; }
.bar { position: relative; height: 10px; border-radius: 5px; background: var(--sunk); overflow: hidden; }
.bar i, .bar b { position: absolute; left: 0; top: 0; bottom: 0; border-radius: 5px; }
.bar i { opacity: .28; }
.bar.k i, .bar.k b { background: var(--tomato); }
.bar.p i, .bar.p b { background: var(--saffron); }
.slot { display: flex; align-items: flex-start; gap: 12px; padding: 12px 0; border-top: 1px solid var(--line); }
.slot:first-of-type { border-top: 0; padding-top: 0; }
.slot:last-of-type { padding-bottom: 0; }
.slot .grow { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 3px; }
.slot .name { background: none; border: 0; padding: 0; text-align: left; font-weight: 600; font-size: 16px; line-height: 1.25; }
.slot .name.link { text-decoration: underline; text-decoration-color: var(--line); text-underline-offset: 3px; }
.slot.ok .name { color: var(--muted); }
.slot .acts { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 4px; }
.check { width: 30px; height: 30px; border-radius: 50%; border: 2px solid var(--line); background: var(--surface); flex: none; display: inline-flex; align-items: center; justify-content: center; padding: 0; margin-top: 16px; }
.check svg { width: 16px; height: 16px; fill: none; stroke: transparent; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; }
.check[aria-pressed="true"] { background: var(--pine); border-color: var(--pine); }
.check[aria-pressed="true"] svg { stroke: var(--on-pine); }
.check.sq { border-radius: 8px; margin-top: 0; width: 26px; height: 26px; }
.stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
.stat { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.stat .num { font-size: 26px; }
.stat .num small { font-size: 15px; color: var(--muted); font-weight: 500; }
.stat.over .num { color: var(--tomato); }
.stat span { font-size: 12px; color: var(--muted); line-height: 1.2; }
.copa { display: inline-flex; align-items: center; border: 1px solid var(--line); border-radius: 999px; overflow: hidden; background: var(--surface); }
.copa button { border: 0; background: none; padding: 6px 11px; font-size: 13.5px; font-weight: 600; }
.copa .menos { border-left: 1px solid var(--line); color: var(--tomato); padding-inline: 10px; }
.copa b { background: var(--tomato-soft); color: var(--tomato); font-size: 12.5px; padding: 2px 7px; border-radius: 999px; margin-left: 4px; font-variant-numeric: tabular-nums; }

/* Peso */
.pesoform { display: grid; grid-template-columns: 1fr 1fr auto; gap: 8px; align-items: end; }
.pesoform label { display: flex; flex-direction: column; gap: 4px; min-width: 0; font-size: 12px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
.pesoform input { font-size: 17px; font-weight: 600; letter-spacing: 0; text-transform: none; color: var(--ink); }
.big4 { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px 8px; }
.big4 .num { font-size: 30px; }
.chart { width: 100%; height: auto; display: block; }
.chart text { font-family: var(--body); font-size: 12px; fill: var(--muted); font-variant-numeric: tabular-nums; }
.verdict { border-radius: var(--r); padding: 14px 16px; background: var(--pine-soft); display: flex; flex-direction: column; gap: 4px; }
.verdict.warn { background: var(--saffron-soft); }
.verdict.alert { background: var(--tomato-soft); }
.verdict b { font-family: var(--display); font-size: 20px; font-weight: 600; text-transform: uppercase; letter-spacing: .03em; }
.tw { overflow-x: auto; }
table { border-collapse: collapse; width: 100%; font-size: 14.5px; font-variant-numeric: tabular-nums; }
th { text-align: left; font-size: 12px; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); font-weight: 700; padding: 0 8px 6px 0; white-space: nowrap; }
td { padding: 8px 8px 8px 0; border-top: 1px solid var(--line); }
td.r, th.r { text-align: right; padding-right: 0; }
.down { color: var(--pine); font-weight: 600; }
.up { color: var(--tomato); font-weight: 600; }
.x { border: 0; background: none; color: var(--muted); padding: 2px 6px; font-size: 18px; line-height: 1; }

/* Recetas */
.recgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 10px; }
.rec { background: var(--surface); border: 0; border-radius: var(--r); padding: 14px; text-align: left; display: flex; flex-direction: column; gap: 8px; min-width: 0; }
.rec .name { font-weight: 600; font-size: 16px; line-height: 1.25; }
.rec .meta, .meta { display: flex; gap: 10px; flex-wrap: wrap; font-size: 13.5px; color: var(--muted); font-variant-numeric: tabular-nums; align-items: center; }
.meta b { color: var(--ink); font-weight: 600; }
.rec .foot { display: flex; gap: 6px; flex-wrap: wrap; margin-top: auto; }
.star { color: var(--saffron); }

/* Compra */
.buy { display: flex; align-items: center; gap: 12px; padding: 9px 0; border-top: 1px solid var(--line); width: 100%; background: none; border-inline: 0; border-bottom: 0; text-align: left; }
.buy:first-child { border-top: 0; }
.buy .grow { flex: 1; min-width: 0; }
.buy .q { font-variant-numeric: tabular-nums; font-weight: 600; white-space: nowrap; }
.buy.ok .grow, .buy.ok .q { text-decoration: line-through; color: var(--muted); }
details { background: var(--surface); border-radius: var(--r); }
summary { padding: 14px 16px; font-weight: 600; cursor: pointer; display: flex; justify-content: space-between; gap: 12px; align-items: baseline; list-style: none; }
summary::-webkit-details-marker { display: none; }
summary > span:first-child { flex: 1; min-width: 0; }
summary > span + span { text-align: right; }
summary::after { content: '+'; font-family: var(--display); font-size: 22px; line-height: .8; color: var(--muted); }
details[open] > summary::after { content: '–'; }
details > div { padding: 0 16px 16px; display: flex; flex-direction: column; gap: 12px; }
.dayline { display: flex; gap: 10px; align-items: flex-start; padding-top: 10px; border-top: 1px solid var(--line); }
.dayline .grow { flex: 1; min-width: 0; }

/* Fuera */
.sino { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
.sino ul { display: flex; flex-direction: column; gap: 6px; font-size: 14.5px; }
.sino li { padding-left: 14px; position: relative; }
.sino li::before { content: ''; position: absolute; left: 0; top: .6em; width: 6px; height: 6px; border-radius: 50%; background: var(--pine); }
.sino .no li::before { background: var(--tomato); border-radius: 1px; }
.reglas { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 14px 20px; }
.reglas b { display: block; }
.pasos { counter-reset: p; display: flex; flex-direction: column; gap: 10px; }
.pasos li { counter-increment: p; padding-left: 34px; position: relative; }
.pasos li::before { content: counter(p); position: absolute; left: 0; top: 0; width: 24px; height: 24px; border-radius: 50%; background: var(--pine-soft); color: var(--pine); font-family: var(--display); font-weight: 600; font-size: 16px; display: flex; align-items: center; justify-content: center; }
.dots { display: flex; flex-direction: column; gap: 7px; }
.dots li { padding-left: 14px; position: relative; }
.dots li::before { content: ''; position: absolute; left: 0; top: .6em; width: 6px; height: 6px; border-radius: 50%; background: var(--pine); }

/* Hoja */
dialog { border: 0; padding: 0; background: var(--bg); color: var(--ink); width: 100%; max-width: 620px; max-height: 88vh; border-radius: 18px 18px 0 0; margin: auto auto 0; overflow: hidden; }
dialog[open] { display: flex; flex-direction: column; }
dialog::backdrop { background: var(--shade); }
.sh-head { display: flex; align-items: flex-start; gap: 12px; padding: 18px 16px 12px; }
.sh-head .grow { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 6px; }
.sh-body { overflow-y: auto; padding: 4px 16px calc(20px + env(safe-area-inset-bottom, 0px)); display: flex; flex-direction: column; gap: 16px; }
.opt { display: flex; gap: 12px; align-items: center; width: 100%; text-align: left; background: var(--surface); border: 1px solid transparent; border-radius: 12px; padding: 11px 14px; }
.opt .grow { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px; }
.opt.cur { border-color: var(--pine); }
.opt b { font-weight: 600; }
#toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(86px + env(safe-area-inset-bottom, 0px)); z-index: 60; background: var(--ink); color: var(--bg); padding: 10px 14px; border-radius: 12px; font-size: 14px; font-weight: 500; display: flex; gap: 12px; align-items: center; max-width: calc(100% - 32px); }
#toast button { background: none; border: 0; color: inherit; font-weight: 700; text-decoration: underline; padding: 0; }
.empty { text-align: center; padding: 22px 12px; color: var(--muted); display: flex; flex-direction: column; gap: 10px; align-items: center; }

@media (min-width: 760px) {
  .app { padding-block: 20px 40px; }
  .tabs { position: sticky; top: env(safe-area-inset-top, 0px); bottom: auto; border-top: 0; border-radius: var(--r); padding: 6px; order: 0; }
  .tabs div { max-width: none; }
  .tab { flex-direction: row; justify-content: center; gap: 8px; font-size: 14px; padding: 9px 4px; }
  .tab svg { width: 20px; height: 20px; }
  dialog { margin: auto; border-radius: 18px; }
  #toast { bottom: 24px; }
}
@media (max-width: 460px) {
  .sino { grid-template-columns: 1fr; }
  .stats { grid-template-columns: repeat(2, 1fr); gap: 12px 8px; }
  .big4 { grid-template-columns: repeat(2, 1fr); }
  .pesoform { grid-template-columns: 1fr 1fr; }
  .pesoform .btn { grid-column: 1 / -1; }
  .meter .num { font-size: 34px; }
}
@media (prefers-reduced-motion: no-preference) {
  .bar b, .bar i { transition: width .25s ease; }
}

.buy .q2 { white-space: normal; text-align: right; max-width: 48%; font-weight: 500; font-size: 14px; color: var(--muted); }
.buy.ok .q2 { text-decoration: line-through; }

.chart .grid { stroke: var(--line); stroke-width: 1; }
.chart .band { fill: var(--pine); opacity: .13; }
.chart .bandt { fill: var(--pine); font-weight: 600; }
.chart .pt { fill: var(--muted); opacity: .55; }
.chart .ln { fill: none; stroke: var(--pine); stroke-width: 3; stroke-linejoin: round; stroke-linecap: round; }
.chart .end { fill: var(--pine); stroke: var(--surface); stroke-width: 2.5; }
.key { display: inline-block; vertical-align: middle; margin-right: 4px; }
.key.pt { width: 8px; height: 8px; border-radius: 50%; background: var(--muted); opacity: .55; }
.key.ln { width: 18px; height: 3px; border-radius: 2px; background: var(--pine); }
.brandrow { display: flex; align-items: center; gap: 12px; min-width: 0; }
.brandrow svg { width: 44px; height: 44px; flex: none; }
.toolrow { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
input[type="file"] { max-width: 100%; font-size: 14px; }

</style>
<div class="app">
  <header class="top">
    <div class="brandrow"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" aria-hidden="true"><rect width="512" height="512" rx="112" fill="#1C5848"/><circle cx="256" cy="256" r="150" fill="none" stroke="#EDF1EC" stroke-width="26"/><path d="M172 206l62 58 42-34 70 76" fill="none" stroke="#F1C04C" stroke-width="30" stroke-linecap="round" stroke-linejoin="round"/><path d="M282 306h64v-64" fill="none" stroke="#F1C04C" stroke-width="30" stroke-linecap="round" stroke-linejoin="round"/></svg><div class="brand">Mi plan de déficit<small>2.300-2.400 kcal · 150-165 g de proteína · 3 entrenos</small></div></div>
    <div class="toolrow"><div class="sync" id="sync" aria-live="polite">Conectando…</div><button class="btn sm" id="bak-btn" data-a="backup" hidden>Copia de seguridad</button></div>
  </header>
  <nav class="tabs" id="tabs" role="tablist" aria-label="Secciones"></nav>
  <main id="view"></main>
</div>
<dialog id="sheet" aria-label="Detalle"></dialog>
<div id="toast" role="status" hidden></div>
<script>
const STANDALONE = true;
/* ---------- Ingredientes: kcal y proteína por 100 g/ml, o por unidad ---------- */
const CATS = [
  ['carne', 'Carne y pescado'],
  ['lacteos', 'Lácteos y huevos'],
  ['verdura', 'Verdura y patata'],
  ['fruta', 'Fruta'],
  ['despensa', 'Despensa'],
  ['basicos', 'Básicos (mira si ya tienes)']
];
const ING = {

/* ---------- Fechas (siempre en hora local) ---------- */
function pad2(n) { return n < 10 ? '0' + n : '' + n; }
function dstr(d) { return d.getFullYear() + '-' + pad2(d.getMonth() + 1) + '-' + pad2(d.getDate()); }
function dparse(s) { const a = s.split('-'); return new Date(+a[0], +a[1] - 1, +a[2], 12); }
function todayStr() { return dstr(new Date()); }
function addDays(s, n) { const d = dparse(s); d.setDate(d.getDate() + n); return dstr(d); }
function diffDays(a, b) { return Math.round((dparse(a) - dparse(b)) / 864e5); }
function monday(s) { const d = dparse(s); const w = (d.getDay() + 6) % 7; return addDays(s, -w); }

/* ---------- Números ---------- */
function miles(n) { return String(Math.round(n)).replace(/\B(?=(\d{3})+(?!\d))/g, '.'); }

/* ---------- Recetas ---------- */
const RBY = {};

function nut(r) {
  let k = 0, p = 0;
  r.ing.forEach(function (x) {
    const g = ING[x[0]];
    if (!g || !g.k && !g.p) return;
    const f = g.u === 'ud' ? x[1] : x[1] / 100;
    k += g.k * f; p += g.p * f;
  });
  return { k: Math.round(k / 5) * 5, p: Math.round(p) };
}
REC.forEach(function (r) { const n = nut(r); r.k = n.k; r.p = n.p; });

function cantidad(id, q) {
  const g = ING[id];
  if (!g.u || !q) return g.n;
  if (id === 'aceite') {
    if (q === 5) return '1 cucharadita de aceite de oliva';
    const c = q / 10;
    return kgf(c, c % 1 ? 1 : 0) + (c === 1 ? ' cucharada' : ' cucharadas') + ' de aceite de oliva';
  }
  if (g.u === 'ud') {
    if (q === 0.5) return '½ ' + g.s[0];
    return q + ' ' + (q === 1 ? g.s[0] : g.s[1]);
  }
  return q + ' ' + g.u + ' de ' + g.n.charAt(0).toLowerCase() + g.n.slice(1);
}

/* ---------- Diario ---------- */
function slotNut(e) {
  if (!e) return null;
  if (e.r && RBY[e.r]) return { k: RBY[e.r].k, p: RBY[e.r].p };
  if (e.x === 'rest') return e.q === 'pas' ? EXTRA.rest_pas : EXTRA.rest_ok;
  if (e.x === 'libre') return EXTRA.libre;
  return null;
}
function copasDe(day) {
  let n = 0, k = 0;
  const c = (day && day.copas) || {};
  BEBIDAS.forEach(function (b) { const q = c[b[0]] || 0; n += q; k += q * b[2]; });
  return { n: n, k: k };
}
function totales(day) {
  const t = { plan: { k: 0, p: 0 }, hecho: { k: 0, p: 0 }, slots: 0, ok: 0 };
  ['des', 'com', 'mer', 'cen'].forEach(function (s) {
    const e = day && day.m && day.m[s];
    const n = slotNut(e);
    if (!n) return;
    t.slots++;
    t.plan.k += n.k; t.plan.p += n.p;
    if (e.ok) { t.ok++; t.hecho.k += n.k; t.hecho.p += n.p; }
  });
  const c = copasDe(day);
  t.plan.k += c.k; t.hecho.k += c.k;
  return t;
}
function semana(dias, pesos, fecha) {
  const l = monday(fecha);
  const r = { entrenos: 0, copas: 0, libres: 0, pesajes: 0 };
  for (let i = 0; i < 7; i++) {
    const f = addDays(l, i), d = dias[f];
    if (pesos[f] != null) r.pesajes++;
    if (!d) continue;
    if (d.entreno) r.entrenos++;
    r.copas += copasDe(d).n;
    ['com', 'cen'].forEach(function (s) { if (d.m && d.m[s] && d.m[s].x === 'libre') r.libres++; });
  }
  return r;
}
/* Última fecha en que cada receta aparece en el diario (hecha o planificada). */
function usos(dias) {
  const u = {};
  Object.keys(dias).forEach(function (f) {
    const m = dias[f].m || {};
    Object.keys(m).forEach(function (s) {
      const id = m[s] && m[s].r;
      if (!id) return;
      (u[id] = u[id] || []).push(f);
    });
  });
  return u;
}
function candidatas(slot, tipo, todas) {
  return REC.filter(function (r) {
    if (slot === 'des' || slot === 'mer') return r.t === slot;
    if (todas) return r.t === 'com' || r.t === 'cen';
    if (slot === 'com') return r.t === 'com';
    const lig = r.tags.indexOf('ligera') >= 0;
    return r.t === 'cen' && (tipo === 'curro' ? lig : !lig);
  });
}
/* Elige una receta para un hueco priorizando las que hace más tiempo que no aparecen cerca de esa fecha. */
function elegir(slot, tipo, fecha, dias, favs, evitar, rnd, solo) {
  rnd = rnd || Math.random;
  const u = usos(dias);
  let c = candidatas(slot, tipo, false).filter(function (r) { return r.id !== evitar; });
  if (solo) { const c2 = c.filter(function (r) { return solo[r.id]; }); if (c2.length) c = c2; }
  if (!c.length) return null;
  const sc = c.map(function (r) {
    let dist = 60;
    (u[r.id] || []).forEach(function (f) { dist = Math.min(dist, Math.abs(diffDays(fecha, f))); });
    const gusta = r.ing.some(function (x) { return ME_GUSTA.indexOf(x[0]) >= 0; });
    return { r: r, s: Math.min(dist, 21) + (favs && favs[r.id] ? 2 : 0) + (gusta ? 0.5 : 0) + rnd() * 4 };
  });
  sc.sort(function (a, b) { return b.s - a.s; });
  return sc[0].r.id;
}

/* ---------- Lista de la compra ---------- */
function compra(dias, desde, n, sueltos) {
  const items = {}; let platos = 0, huecos = 0;
  for (let i = 0; i < n; i++) {
    const d = dias[addDays(desde, i)] || { tipo: 'casa', m: {} };
    ['des', 'com', 'mer', 'cen'].forEach(function (s) {
      const e = d.m && d.m[s];
      if (!e) { if (!(s === 'com' && d.tipo === 'curro')) huecos++; return; }
      if (!e.r || e.ok || !RBY[e.r]) return;
      platos++;
      RBY[e.r].ing.forEach(function (x) { items[x[0]] = (items[x[0]] || 0) + x[1]; });
    });
  }
  Object.keys(sueltos || {}).forEach(function (id) {
    const q = sueltos[id];
    if (!RBY[id] || !(q > 0)) return;
    platos += q;
    RBY[id].ing.forEach(function (x) { items[x[0]] = (items[x[0]] || 0) + x[1] * q; });
  });
  return { items: items, platos: platos, huecos: huecos };
}
function cantCompra(id, q) {
  const g = ING[id];
  if (!g.u || g.c === 'basicos') return '';
  if (g.u === 'ud') return Math.ceil(q) + ' ud';
  const r = Math.ceil(q / 10) * 10;
  if (r >= 1000) return kgf(r / 1000, 1) + (g.u === 'ml' ? ' l' : ' kg');
  return r + ' ' + g.u;
}

/* Recetas que salen con un conjunto de productos (los básicos y el limón se dan por comprados). */
function recetasCon(ids) {
  const set = {};
  ids.forEach(function (i) { set[i] = true; });
  return REC.filter(function (r) {
    return r.ing.every(function (x) { return ING[x[0]].c === 'basicos' || x[0] === 'limon' || set[x[0]]; });
  });
}

/* ---------- Peso ---------- */
function media(a) { return a.reduce(function (x, y) { return x + y; }, 0) / a.length; }
function ventana(kg, hoy, desde, hasta) {
  const v = [];
  for (let i = desde; i <= hasta; i++) { const x = kg[addDays(hoy, -i)]; if (x != null) v.push(x); }
  return v;
}
function serie(kg) {
  return Object.keys(kg).sort().map(function (f) {
    return { f: f, kg: kg[f], m7: media(ventana(kg, f, 0, 6)) };
  });
}
function semanasPeso(kg) {
  const g = {};
  Object.keys(kg).forEach(function (f) { const l = monday(f); (g[l] = g[l] || []).push(kg[f]); });
  const ls = Object.keys(g).sort();
  return ls.map(function (l, i) {
    const m = media(g[l]);
    return { lunes: l, n: g[l].length, media: m, cambio: i ? m - media(g[ls[i - 1]]) : null };
  });
}
function analizar(kg, hoy) {
  const fs = Object.keys(kg).sort();
  const r = { n: fs.length, estado: 'vacio' };
  if (!fs.length) return r;
  r.primero = kg[fs[0]]; r.fprimero = fs[0];
  r.ultimo = kg[fs[fs.length - 1]]; r.fultimo = fs[fs.length - 1];
  const a = ventana(kg, hoy, 0, 6), b = ventana(kg, hoy, 7, 13), c = ventana(kg, hoy, 14, 20);
  r.n7 = a.length;
  r.m7 = a.length ? media(a) : null;
  r.total = (r.m7 != null ? r.m7 : r.ultimo) - r.primero;
  r.dias = diffDays(hoy, fs[0]) + 1;
  if (a.length >= 3 && r.m7 <= PLAN.revision) { r.estado = 'revision'; return r; }
  if (a.length < 3 || b.length < 3) { r.estado = 'pocos'; return r; }
  r.ritmo = r.m7 - media(b);
  if (c.length >= 3) { r.ritmo = (r.m7 - media(c)) / 2; r.firme = true; }
  const baja = -r.ritmo;
  r.estado = baja > 0.7 ? 'rapido' : baja < 0.25 ? 'lento' : 'bien';
  return r;
}

function clone(o) { return JSON.parse(JSON.stringify(o)); }
function norm(d, v) {
  v = v && typeof v === 'object' ? v : {};
  if (d === 'peso') return { kg: v.kg || {}, cintura: v.cintura || {} };
  if (d === 'diario') return { dias: v.dias || {} };
  if (d === 'compra') return { hechos: v.hechos || {}, extras: Array.isArray(v.extras) ? v.extras : [], n: [3, 5, 7].indexOf(v.n) >= 0 ? v.n : 5, sueltos: v.sueltos || {}, modo: v.modo === 'base' ? 'base' : 'plan', amp: !!v.amp, solo: !!v.solo };

}
function loadLocal() {
  DOCS.forEach(function (d) {
    try { const v = JSON.parse(localStorage.getItem('plandef.' + d)); if (v) S[d] = norm(d, v); } catch (e) { /* sin almacenamiento local */ }
  });
}
function saveLocal(d) { try { localStorage.setItem('plandef.' + d, JSON.stringify(S[d])); } catch (e) { /* sin almacenamiento local */ } }

let col = null, remoto = 'espera';
const sucio = {}, volando = {}, timers = {};
function syncUI() {
  const el = document.getElementById('sync');
  if (!el) return;
  const pend = DOCS.some(function (d) { return sucio[d] || volando[d]; });
  let s = 'ok', t = 'Guardado en tu cuenta';
  if (remoto === 'espera') { s = ''; t = 'Conectando…'; }
  else if (remoto === 'local') { s = STANDALONE ? 'ok' : ''; t = STANDALONE ? 'Guardado en este dispositivo' : 'Guardado solo en este dispositivo'; }
  else if (remoto === 'error') { s = 'err'; t = 'No se pudo guardar en tu cuenta'; }
  else if (pend) { s = ''; t = 'Guardando…'; }
  el.dataset.s = s; el.textContent = t;
}
function save(d) {
  if (d === 'diario') {
    const lim = addDays(todayStr(), -180);
    Object.keys(S.diario.dias).forEach(function (f) { if (f < lim) delete S.diario.dias[f]; });
  }
  saveLocal(d);
  if (col) {
    sucio[d] = true;
    clearTimeout(timers[d]);
    timers[d] = setTimeout(function () { flush(d); }, 700);
  }
  syncUI();
}
async function flush(d, reintento) {
  if (!col || volando[d] || !sucio[d]) return;
  sucio[d] = false; volando[d] = true; syncUI();
  try {
    await col.doc(d).set(clone(S[d]));
    if (remoto === 'error') remoto = 'ok';
  } catch (e) {
    if (e && e.code === 'unavailable' && !reintento) {
      volando[d] = false; sucio[d] = true;
      setTimeout(function () { flush(d, true); }, 1500 + Math.random() * 1500);
      return;
    }
    remoto = 'error';
  }
  volando[d] = false;
  if (sucio[d]) flush(d);
  syncUI();
}
async function initRemoto() {
  try {
    if (!window.claude || !window.claude.use) { remoto = 'local'; syncUI(); return; }
    const r = await Promise.all([window.claude.use('db'), window.claude.use('user')]);
    const db = r[0], user = r[1];
    const uid = db && user ? await user.id() : null;
    if (!uid) { remoto = 'local'; syncUI(); return; }
    col = db.collection('data/users/' + uid);
    remoto = 'ok'; syncUI();
    DOCS.forEach(function (d) {
      col.doc(d).onSnapshot(function (snap) {
        if (sucio[d] || volando[d] || snap.metadata.hasPendingWrites || !snap.exists) return;
        const v = norm(d, clone(snap.data()));
        if (JSON.stringify(v) === JSON.stringify(S[d])) return;
        S[d] = v; saveLocal(d); render();
      }, function () { remoto = 'error'; syncUI(); });
    });
  } catch (e) { remoto = 'local'; syncUI(); }
}

  return REC.filter(function (r) {
    if (bm && !bm[r.id]) return false;
    if (ui.rtipo !== 'todo' && r.t !== ui.rtipo) return false;
    if (ui.rflags.rapida && r.min > PLAN.maxMin) return false;
    if (ui.rflags.taper && r.tags.indexOf('taper') < 0) return false;
    if (ui.rflags.ligera && r.tags.indexOf('ligera') < 0) return false;
    if (ui.rflags.fav && !S.prefs.favs[r.id]) return false;

}

/* ---------- Compra ---------- */
function listaCompra() {
  const c = compra(S.diario.dias, todayStr(), S.compra.n, S.compra.sueltos), g = {};
  Object.keys(c.items).forEach(function (id) { (g[ING[id].c] = g[ING[id].c] || []).push(id); });
  return { c: c, g: g };
}
function textoCompra() {
  if (S.compra.modo === 'base') {
    const l = S.compra.amp ? BASE.concat(BASE2) : BASE;
    let t = 'COMPRA BASE (una semana)\n';
    CATS.forEach(function (cat) {
      const it = l.filter(function (x) { return ING[x[0]].c === cat[0] && !S.compra.hechos[x[0]]; });
      if (it.length) t += '\n' + cat[1] + '\n' + it.map(function (x) { return '- ' + ING[x[0]].n + ': ' + x[1]; }).join('\n') + '\n';
    });
    const ex = S.compra.extras.filter(function (e) { return !e.ok; });
    if (ex.length) t += '\nOtros\n' + ex.map(function (e) { return '- ' + e.t; }).join('\n') + '\n';
    return t;
  }
  const x = listaCompra();
  let t = 'LISTA DE LA COMPRA (' + S.compra.n + ' días)\n';
  CATS.forEach(function (cat) {
    const ids = (x.g[cat[0]] || []).filter(function (id) { return !S.compra.hechos[id]; });
    if (!ids.length) return;
    t += '\n' + cat[1] + '\n' + ids.sort(function (a, b) { return ING[a].n.localeCompare(ING[b].n, 'es'); }).map(function (id) {
      const q = cantCompra(id, x.c.items[id]); return '- ' + ING[id].n + (q ? ': ' + q : '');
    }).join('\n') + '\n';
  });
  const ex = S.compra.extras.filter(function (e) { return !e.ok; });
  if (ex.length) t += '\nOtros\n' + ex.map(function (e) { return '- ' + e.t; }).join('\n') + '\n';
  return t;
}

  if (!el.open) { try { el.showModal(); } catch (e) { el.setAttribute('open', ''); } }
}
function abrir(h) { hoja = h; renderHoja(); const b = document.querySelector('#sheet .sh-body'); if (b) b.scrollTop = 0; }

/* ---------- Render y eventos ---------- */
function render() {
  document.getElementById('tabs').innerHTML = '<div>' + TABS.map(function (t) {
    return '<button class="tab" role="tab" data-a="tab" data-t="' + t[0] + '" aria-selected="' + (tab === t[0]) + '">' + IC[t[0]] + '<span>' + t[1] + '</span></button>';
  }).join('') + '</div>';
  const v = document.getElementById('view');
  v.innerHTML = tab === 'hoy' ? vHoy() : tab === 'peso' ? vPeso() : tab === 'recetas' ? vRecetas() : tab === 'compra' ? vCompra() : vFuera();
  if (hoja) renderHoja();
  syncUI();
}
function irTab(t) {
  tab = t; hoja = null; renderHoja(); render(); window.scrollTo(0, 0);
  try { history.replaceState(null, '', '#' + t); } catch (e) { /* sin historial */ }
}
function guardarPeso(f, v) {
  const prev = S.peso.kg[f];
  S.peso.kg[f] = v; save('peso'); render();
  toast('Guardado: ' + kgf(v, 2).replace(/0$/, '') + ' kg el ' + fcorta(f), function () {
    if (prev == null) delete S.peso.kg[f]; else S.peso.kg[f] = prev;
    save('peso'); render();
  });
}
document.addEventListener('click', function (ev) {
  const sheet = document.getElementById('sheet');
  if (ev.target === sheet) { hoja = null; renderHoja(); return; }
  const b = ev.target.closest('[data-a]');
  if (!b) return;
  const a = b.dataset.a, s = b.dataset.s;
  let d;
  switch (a) {
    case 'tab': irTab(b.dataset.t); break;
    case 'undo': if (toastUndo) { const f = toastUndo; toastUndo = null; document.getElementById('toast').hidden = true; f(); } break;
    case 'close': hoja = null; renderHoja(); break;
    case 'dia': dia = b.dataset.f; render(); break;
    case 'ir': dia = b.dataset.f; irTab('hoy'); break;
    case 'tipo': setTipo(dia, b.dataset.t); save('diario'); render(); if (b.dataset.t === 'curro') toast('Comida de restaurante y cena ligera'); break;
    case 'ctipo': setTipo(b.dataset.f, b.dataset.t); save('diario'); render(); break;
    case 'ok': d = mutDay(dia); if (d.m[s]) { d.m[s].ok = !d.m[s].ok; save('diario'); render(); } break;
    case 'restq': d = mutDay(dia); if (d.m[s]) { d.m[s].q = b.dataset.q; save('diario'); render(); } break;
    case 'pick': ui.pickAll = false; abrir({ k: 'pick', s: s }); break;
    case 'pickall': ui.pickAll = !ui.pickAll; renderHoja(); break;
    case 'otra': {
      d = mutDay(dia);
      const id = elige(s, d.tipo, dia, d.m[s] && d.m[s].r);
      if (id) { d.m[s] = { r: id }; save('diario'); render(); }
      break;
    }
    case 'set': {
      d = mutDay(dia);
      const prev = d.m[s] ? clone(d.m[s]) : null, f = dia;
      d.m[s] = b.dataset.x ? { x: b.dataset.x } : { r: b.dataset.id };
      save('diario'); hoja = null; renderHoja();
      if (tab !== 'hoy') {
        render();
        toast(TIPOS[s] + ' del ' + fcorta(f) + ' cambiada', function () { const x = mutDay(f); if (prev) x.m[s] = prev; else delete x.m[s]; save('diario'); render(); });
      } else render();
      break;
    }
    case 'clear': d = mutDay(dia); delete d.m[s]; save('diario'); hoja = null; renderHoja(); render(); break;
    case 'rec': abrir({ k: 'rec', id: b.dataset.id }); break;
    case 'fav': if (S.prefs.favs[b.dataset.id]) delete S.prefs.favs[b.dataset.id]; else S.prefs.favs[b.dataset.id] = true; save('prefs'); render(); break;
    case 'entreno': d = mutDay(dia); d.entreno = !d.entreno; save('diario'); render(); break;
    case 'copa+': d = mutDay(dia); d.copas = d.copas || {}; d.copas[b.dataset.b] = (d.copas[b.dataset.b] || 0) + 1; save('diario'); render(); break;
    case 'copa-': d = mutDay(dia); if (d.copas && d.copas[b.dataset.b]) { d.copas[b.dataset.b]--; if (!d.copas[b.dataset.b]) delete d.copas[b.dataset.b]; save('diario'); render(); } break;
    case 'fill7': { const n = rellenar(dia, 7); save('diario'); render(); toast(n + ' platos añadidos a los próximos 7 días'); break; }
    case 'fillrange': { const n = rellenar(todayStr(), S.compra.n); save('diario'); render(); toast(n + ' platos añadidos'); break; }
    case 'peso-hoy': { const v = leerNum('hoy-kg', 40, 200); if (v != null) guardarPeso(todayStr(), v); break; }
    case 'peso-del': {
      const f = b.dataset.f, prev = S.peso.kg[f];
      delete S.peso.kg[f]; save('peso'); render();
      toast('Pesaje borrado', function () { S.peso.kg[f] = prev; save('peso'); render(); });
      break;
    }
    case 'cint-del': {
      const f = b.dataset.f, prev = S.peso.cintura[f];
      delete S.peso.cintura[f]; save('peso'); render();
      toast('Medida borrada', function () { S.peso.cintura[f] = prev; save('peso'); render(); });
      break;
    }
    case 'peso-todos': ui.pesoTodos = !ui.pesoTodos; render(); break;
    case 'rtipo': ui.rtipo = b.dataset.t; render(); break;
    case 'rflag': ui.rflags[b.dataset.f] = !ui.rflags[b.dataset.f]; render(); break;
    case 'rclear': ui.rtipo = 'todo'; ui.rflags = {}; ui.q = ''; render(); break;
    case 'cn': S.compra.n = +b.dataset.n; save('compra'); render(); break;
    case 'chk': if (S.compra.hechos[b.dataset.id]) delete S.compra.hechos[b.dataset.id]; else S.compra.hechos[b.dataset.id] = true; save('compra'); render(); break;
    case 'buy+': S.compra.sueltos[b.dataset.id] = (S.compra.sueltos[b.dataset.id] || 0) + 1; save('compra'); render(); if (S.compra.sueltos[b.dataset.id] === 1) toast('Añadido a la lista de la compra'); break;
    case 'buy-': if (S.compra.sueltos[b.dataset.id] > 1) S.compra.sueltos[b.dataset.id]--; else delete S.compra.sueltos[b.dataset.id]; save('compra'); render(); break;
    case 'cmodo': S.compra.modo = b.dataset.m; save('compra'); render(); break;
    case 'camp': S.compra.amp = !S.compra.amp; save('compra'); render(); break;
    case 'csolo': S.compra.solo = !S.compra.solo; save('compra'); render(); break;
    case 'verbase': ui.rtipo = 'todo'; ui.rflags = { base: true }; ui.q = ''; irTab('recetas'); break;
    case 'backup': bakPend = null; abrir({ k: 'bak' }); break;
    case 'bak-dl': {
      const data = { app: 'mi-plan-deficit', fecha: todayStr() };
      DOCS.forEach(function (d) { data[d] = S[d]; });
      try {
        const url = URL.createObjectURL(new Blob([JSON.stringify(data)], { type: 'application/json' }));
        const a2 = document.createElement('a');
        a2.href = url; a2.download = 'mi-plan-copia-' + todayStr() + '.json';
        document.body.appendChild(a2); a2.click(); a2.remove();
        setTimeout(function () { URL.revokeObjectURL(url); }, 4000);
        toast('Copia descargada');
      } catch (e) { toast('No se pudo descargar la copia'); }
      break;
    }
    case 'bak-ok':
      if (bakPend) { DOCS.forEach(function (d) { S[d] = norm(d, bakPend[d]); save(d); }); bakPend = null; hoja = null; renderHoja(); render(); toast('Copia restaurada'); }
      break;
    case 'bak-cancel': bakPend = null; renderHoja(); break;
    case 'uncheck': {
      const prev = clone(S.compra.hechos);
      S.compra.hechos = {}; save('compra'); render();
      toast('Lista desmarcada', function () { S.compra.hechos = prev; save('compra'); render(); });
      break;
    }
    case 'extra-chk': { const e = S.compra.extras[+b.dataset.i]; if (e) { e.ok = !e.ok; save('compra'); render(); } break; }
    case 'extra-del': S.compra.extras.splice(+b.dataset.i, 1); save('compra'); render(); break;
    case 'copy': {
      const t = textoCompra();
      const fallo = function () { abrir({ k: 'txt', t: t }); const ta = document.getElementById('copytxt'); if (ta) { ta.focus(); ta.select(); } };
      try { navigator.clipboard.writeText(t).then(function () { toast('Lista copiada'); }, fallo); } catch (e) { fallo(); }
      break;
    }
  }
});
document.addEventListener('submit', function (ev) {
  const f = ev.target.dataset.form;
  if (!f) return;
  ev.preventDefault();
  if (f === 'peso') {
    const v = leerNum('peso-kg', 40, 200), fecha = document.getElementById('peso-fecha').value || todayStr();
    if (v == null) return;
    if (fecha > todayStr()) { toast('La fecha no puede ser futura'); return; }
    guardarPeso(fecha, v);
  } else if (f === 'cintura') {
    const v = leerNum('cintura-cm', 50, 150);
    if (v == null) return;
    S.peso.cintura[todayStr()] = v; save('peso'); render(); toast('Cintura guardada: ' + kgf(v, 1) + ' cm');
  } else if (f === 'extra') {
    const el = document.getElementById('extra-txt'), t = el.value.trim();
    if (!t) return;
    S.compra.extras.push({ t: t.slice(0, 80) }); save('compra'); render();
    const n = document.getElementById('extra-txt'); if (n) n.focus();
  }
});
document.addEventListener('input', function (ev) {
  if (ev.target.id !== 'buscar') return;
  ui.q = ev.target.value;
  document.getElementById('rec-list').innerHTML = recList();
});
document.addEventListener('change', function (ev) {
  if (ev.target.id !== 'bak-file' || !ev.target.files || !ev.target.files[0]) return;
  const fr = new FileReader();
  fr.onload = function () {
    try {
      const v = JSON.parse(fr.result);
      if (!v || v.app !== 'mi-plan-deficit' || !v.peso || !v.diario) throw new Error('formato');
      bakPend = { fecha: /^\d{4}-\d{2}-\d{2}$/.test(v.fecha) ? v.fecha : null };
      DOCS.forEach(function (d) { bakPend[d] = norm(d, v[d]); });
      renderHoja();
    } catch (e) { toast('Ese archivo no es una copia de esta app'); }
  };
  fr.readAsText(ev.target.files[0]);
});
document.addEventListener('keydown', function (ev) {
  if (ev.key === 'Enter' && ev.target.id === 'hoy-kg') { const v = leerNum('hoy-kg', 40, 200); if (v != null) guardarPeso(todayStr(), v); }
});
document.getElementById('sheet').addEventListener('close', function () { hoja = null; });
let rsT = null, rsW = window.innerWidth;
window.addEventListener('resize', function () {
  if (tab !== 'peso' || window.innerWidth === rsW) return;
  rsW = window.innerWidth;
  clearTimeout(rsT);
  rsT = setTimeout(function () { const a = document.activeElement; if (!a || a.tagName !== 'INPUT') render(); }, 200);
});

(function () {
  const h = (location.hash || '').slice(1);
  if (TABS.some(function (t) { return t[0] === h; })) tab = h;
  loadLocal();
  render();
  initRemoto();
  if (STANDALONE) {
    const bk = document.getElementById('bak-btn'); if (bk) bk.hidden = false;
    try { if (navigator.storage && navigator.storage.persist) navigator.storage.persist(); } catch (e) { /* opcional */ }
    if ('serviceWorker' in navigator && location.protocol.indexOf('http') === 0) navigator.serviceWorker.register('sw.js').catch(function () { /* sin modo offline */ });
  }
})();

</script>
